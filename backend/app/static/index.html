<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>逐字稿提取器</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
      body { margin: 0; background: #f5f7fa; color: #172033; }
      main { width: min(820px, calc(100% - 32px)); margin: 48px auto; }
      section { background: white; border: 1px solid #dde3ec; border-radius: 14px; padding: 24px; margin-top: 18px; }
      h1 { margin-bottom: 8px; } .muted { color: #667085; }
      input[type="file"] { display: block; margin: 14px 0; max-width: 100%; }
      input[type="url"] { display: block; width: 100%; box-sizing: border-box; margin: 14px 0; padding: 10px 12px; border: 1px solid #cfd6e4; border-radius: 8px; font-size: 15px; }
      .modes { display: flex; gap: 8px; margin-bottom: 4px; }
      .modes button { background: #eef2f9; color: #172033; border: 1px solid #dde3ec; }
      .modes button[aria-selected="true"] { background: #2563eb; color: white; border-color: #2563eb; }
      button, a.button { border: 0; border-radius: 8px; background: #2563eb; color: white; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
      button:disabled { opacity: .5; cursor: wait; }
      #status { font-weight: 600; } #error { color: #b42318; white-space: pre-wrap; }
      #task-detail { color: #667085; margin-top: 10px; }
      #meta { color: #667085; margin-bottom: 12px; line-height: 1.7; }
      #transcript { white-space: pre-wrap; line-height: 1.7; max-height: 480px; overflow: auto; }
      .downloads { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
      .hint { color: #667085; margin: 6px 0 0; font-size: 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>逐字稿提取器</h1>
      <p class="muted">上传本地音频 / 视频文件，或粘贴 B 站视频链接，生成 Markdown 和 TXT 逐字稿。</p>

      <section>
        <div class="modes" role="tablist">
          <button id="mode-file" role="tab" aria-selected="true">上传本地文件</button>
          <button id="mode-url" role="tab" aria-selected="false">粘贴 B 站链接</button>
        </div>

        <div id="panel-file">
          <label for="file">选择音频或视频</label>
          <input id="file" type="file" accept=".mp3,.m4a,.wav,.mp4,.mov,audio/*,video/mp4,video/quicktime" />
          <p id="limit" class="muted"></p>
        </div>

        <div id="panel-url" hidden>
          <label for="url">B 站视频链接</label>
          <input id="url" type="url" placeholder="https://www.bilibili.com/video/BV..." autocomplete="off" />
          <p class="hint">支持单个视频链接。多 P 视频请粘贴某一个分集的链接。</p>
          <p id="url-limit" class="muted"></p>
        </div>

        <button id="submit">开始提取</button>
      </section>

      <section id="progress" hidden>
        <div id="status"></div>
        <div id="task-detail"></div>
        <div id="error"></div>
      </section>

      <section id="result" hidden>
        <h2 id="filename"></h2>
        <div id="meta"></div>
        <div id="transcript"></div>
        <div class="downloads">
          <a id="markdown" class="button">下载 Markdown</a>
          <a id="txt" class="button">下载 TXT</a>
        </div>
      </section>
    </main>
    <script>
      const fileInput = document.querySelector('#file');
      const urlInput = document.querySelector('#url');
      const submit = document.querySelector('#submit');
      const progress = document.querySelector('#progress');
      const statusNode = document.querySelector('#status');
      const errorNode = document.querySelector('#error');
      const detailNode = document.querySelector('#task-detail');
      const metaNode = document.querySelector('#meta');
      const resultNode = document.querySelector('#result');
      const panelFile = document.querySelector('#panel-file');
      const panelUrl = document.querySelector('#panel-url');
      const modeFile = document.querySelector('#mode-file');
      const modeUrl = document.querySelector('#mode-url');
      const activeTaskKey = 'transcript-extractor.active-task-id';
      let config = { max_upload_mb: 2048, task_poll_interval_seconds: 2, max_media_minutes: 180 };
      let currentMode = 'file';
      let currentTask = null;
      let elapsedTimer = null;

      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      const formatDuration = seconds => {
        const value = Math.max(0, Math.floor(seconds || 0));
        const hours = Math.floor(value / 3600);
        const minutes = Math.floor((value % 3600) / 60);
        const secs = value % 60;
        return hours > 0
          ? `${hours}小时${String(minutes).padStart(2, '0')}分${String(secs).padStart(2, '0')}秒`
          : `${minutes}分${String(secs).padStart(2, '0')}秒`;
      };

      function switchMode(mode) {
        currentMode = mode;
        modeFile.setAttribute('aria-selected', String(mode === 'file'));
        modeUrl.setAttribute('aria-selected', String(mode === 'url'));
        panelFile.hidden = mode !== 'file';
        panelUrl.hidden = mode !== 'url';
        errorNode.textContent = '';
      }

      function renderTaskDetail() {
        if (!currentTask) { detailNode.textContent = ''; return; }
        const terminal = ['succeeded', 'failed'].includes(currentTask.status);
        const elapsed = terminal
          ? currentTask.elapsed_seconds
          : (Date.now() - new Date(currentTask.created_at).getTime()) / 1000;
        const parts = [terminal ? `总耗时：${formatDuration(elapsed)}` : `任务仍在运行 · 已用时：${formatDuration(elapsed)}`];
        if (currentTask.media_duration_seconds) {
          parts.push(`媒体时长：${formatDuration(currentTask.media_duration_seconds)}`);
        }
        if (currentTask.estimated_remaining_seconds) {
          parts.push(`预计还需约：${formatDuration(currentTask.estimated_remaining_seconds)}`);
        }
        detailNode.textContent = parts.join(' · ');
      }

      function startElapsedTimer() {
        if (elapsedTimer) clearInterval(elapsedTimer);
        elapsedTimer = setInterval(renderTaskDetail, 1000);
      }

      function stopElapsedTimer() {
        if (elapsedTimer) clearInterval(elapsedTimer);
        elapsedTimer = null;
      }

      async function jsonOrError(response) {
        let payload;
        try {
          payload = await response.json();
        } catch (_) {
          throw new Error('服务暂时不可用，请稍后重试');
        }
        if (!response.ok) throw new Error(payload.error?.message || '请求失败');
        return payload;
      }

      function renderMeta(task) {
        const parts = [];
        if (task.source_url) parts.push(`来源：${task.source_url}`);
        parts.push(`处理方式：${task.processing_method_label}`);
        metaNode.textContent = parts.join('\n');
      }

      async function poll(taskId) {
        localStorage.setItem(activeTaskKey, taskId);
        let consecutiveFailures = 0;
        startElapsedTimer();
        while (true) {
          try {
            const task = await jsonOrError(await fetch(`/api/v1/tasks/${taskId}`));
            consecutiveFailures = 0;
            currentTask = task;
            statusNode.textContent = task.stage_message;
            renderTaskDetail();
            if (task.status === 'failed') {
              stopElapsedTimer();
              throw new Error(task.error?.message || '处理失败');
            }
            if (task.status === 'succeeded') {
              stopElapsedTimer();
              const result = await jsonOrError(await fetch(`/api/v1/tasks/${taskId}/result`));
              document.querySelector('#filename').textContent = result.original_filename;
              renderMeta(task);
              document.querySelector('#transcript').textContent = result.text;
              document.querySelector('#markdown').href = task.artifacts.markdown;
              document.querySelector('#txt').href = task.artifacts.txt;
              resultNode.hidden = false;
              return;
            }
          } catch (error) {
            if (currentTask?.status === 'failed') throw error;
            consecutiveFailures += 1;
            if (consecutiveFailures >= 5) { stopElapsedTimer(); throw error; }
            statusNode.textContent = `连接暂时中断，正在重试（${consecutiveFailures}/5）`;
          }
          await sleep(config.task_poll_interval_seconds * 1000);
        }
      }

      function looksLikeBilibiliLink(value) {
        return /^https?:\/\/([\w-]+\.)*(bilibili\.com|b23\.tv)\//i.test(value);
      }

      async function startTask(request) {
        submit.disabled = true;
        resultNode.hidden = true;
        progress.hidden = false;
        currentTask = null;
        detailNode.textContent = '';
        metaNode.textContent = '';
        errorNode.textContent = '';
        statusNode.textContent = '正在提交任务';
        try {
          const created = await jsonOrError(await request());
          await poll(created.task_id);
        } catch (error) {
          errorNode.textContent = error.message;
        } finally {
          submit.disabled = false;
        }
      }

      submit.addEventListener('click', async () => {
        if (currentMode === 'url') {
          const url = urlInput.value.trim();
          if (!url) { progress.hidden = false; errorNode.textContent = '请先粘贴 B 站视频链接'; return; }
          if (!looksLikeBilibiliLink(url)) {
            progress.hidden = false;
            errorNode.textContent = '链接格式不正确，请粘贴完整的 B 站视频链接';
            return;
          }
          await startTask(() => fetch('/api/v1/tasks/from-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          }));
          return;
        }

        const file = fileInput.files[0];
        if (!file) { progress.hidden = false; errorNode.textContent = '请先选择文件'; return; }
        if (file.size > config.max_upload_mb * 1024 * 1024) {
          progress.hidden = false;
          errorNode.textContent = `文件不能超过 ${config.max_upload_mb} MB`;
          return;
        }
        await startTask(() => {
          const form = new FormData();
          form.append('file', file);
          return fetch('/api/v1/tasks', { method: 'POST', body: form });
        });
      });

      modeFile.addEventListener('click', () => switchMode('file'));
      modeUrl.addEventListener('click', () => switchMode('url'));

      async function initialize() {
        try {
          config = await jsonOrError(await fetch('/api/v1/config'));
        } catch (_) {
          /* 使用默认值兜底 */
        }
        document.querySelector('#limit').textContent = `文件大小上限：${config.max_upload_mb} MB`;
        document.querySelector('#url-limit').textContent =
          `单个视频时长上限：${config.max_media_minutes} 分钟。超长内容建议分段处理。`;

        const taskId = localStorage.getItem(activeTaskKey);
        if (!taskId) return;
        submit.disabled = true;
        progress.hidden = false;
        statusNode.textContent = '正在恢复上次任务';
        try {
          await poll(taskId);
        } catch (error) {
          errorNode.textContent = error.message;
        } finally {
          submit.disabled = false;
        }
      }

      initialize();
    </script>
  </body>
</html>
